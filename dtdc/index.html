<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f8f9fa; }
  h2 { color: #333; margin-top: 0; }
  .rate-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; white-space: pre-wrap; font-size: 13px; max-height: 250px; overflow-y: auto; }
  label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
  select { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background: white; }
  button { margin-top: 20px; padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
  button:hover { background: #1565c0; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #statusMsg { margin-top: 10px; font-size: 13px; }
</style>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>

<h2>Select DTDC Service</h2>
<div class="rate-box" id="ratesDisplay">Loading rates...</div>

<label>Service</label>
<select id="serviceSelect">
  <option value="">-- choose a service --</option>
</select>

<button id="submitBtn" onclick="submitRate()">Confirm Service</button>
<div id="statusMsg"></div>

<script>
var recordId = null;

ZOHO.embeddedApp.on("PageLoad", function(data){
  recordId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
  ZOHO.CRM.API.getRecord({Entity:"Seznik_Automation", RecordID: recordId}).then(function(response){
    var record = response.data[0];
    var rates = record.DTDC_Available_Services || "";
    if(rates.trim() === ""){
      document.getElementById("ratesDisplay").innerText =
        "No rates on this record yet.\n\nClose this window, click Get DTDC Rates first, then try again.";
      document.getElementById("submitBtn").disabled = true;
      return;
    }
    document.getElementById("ratesDisplay").innerText = rates;
    buildDropdown(rates);
  }).catch(function(err){
    document.getElementById("ratesDisplay").innerText = "Could not read the record: " + JSON.stringify(err);
    document.getElementById("submitBtn").disabled = true;
  });
});

ZOHO.embeddedApp.init();

function buildDropdown(rateText){
  var sel = document.getElementById("serviceSelect");
  var known = ["B2C PRIORITY", "B2C SMART EXPRESS"];
  var found = [];
  var upper = rateText.toUpperCase();
  for(var i = 0; i < known.length; i++){
    if(upper.indexOf(known[i]) > -1){ found.push(known[i]); }
  }
  // if the text could not be read, still offer both contracted services
  if(found.length === 0){ found = known; }
  for(var j = 0; j < found.length; j++){
    var o = document.createElement("option");
    o.value = found[j];
    o.text = found[j];
    sel.add(o);
  }
}

function submitRate(){
  var statusDiv = document.getElementById("statusMsg");
  var service = document.getElementById("serviceSelect").value;
  if(service === ""){
    statusDiv.innerHTML = "<span style='color:red;'>Choose a service first.</span>";
    return;
  }
  document.getElementById("submitBtn").disabled = true;
  statusDiv.innerHTML = "Saving...";

  var recordData = {
    "DTDC_Service_Type": service,
    "DTDC_Shipping_Status": "Pending - Ready to Ship"
  };

  ZOHO.CRM.API.updateRecord({
    Entity: "Seznik_Automation",
    APIData: Object.assign({id: recordId}, recordData),
    Trigger: ["workflow"]
  }).then(function(response){
    statusDiv.innerHTML = "<span style='color:green;'>Saved " + service + ". Now click <b>Book DTDC Shipment &amp; Label</b>.</span>";
    setTimeout(function(){ ZOHO.CRM.UI.Popup.closeReload(); }, 1600);
  }).catch(function(err){
    statusDiv.innerHTML = "<span style='color:red;'>Error: " + JSON.stringify(err) + "</span>";
    document.getElementById("submitBtn").disabled = false;
  });
}
</script>

</body>
</html>
