<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f8f9fa; }
  h2 { color: #333; margin-top: 0; }
  .opt { background: white; border: 2px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; cursor: pointer; display: block; }
  .opt:hover { border-color: #90caf9; }
  .opt.sel { border-color: #1976d2; background: #e3f2fd; }
  .opt input { margin-right: 10px; }
  .svc { font-weight: bold; font-size: 14px; color: #222; }
  .meta { font-size: 13px; color: #555; margin-top: 6px; margin-left: 24px; }
  .price { font-size: 18px; font-weight: bold; color: #1976d2; }
  button { margin-top: 18px; padding: 12px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
  button:hover { background: #1565c0; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #statusMsg { margin-top: 12px; font-size: 13px; }
  .empty { background: #fff3cd; border: 1px solid #ffe08a; border-radius: 6px; padding: 14px; font-size: 13px; }
</style>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
</head>
<body>

<h2>Select DTDC Service</h2>
<div id="optionsArea">Loading rates...</div>
<button id="submitBtn" onclick="submitRate()" disabled>Confirm Service</button>
<div id="statusMsg"></div>

<script>
var recordId = null;
var parsed = [];

ZOHO.embeddedApp.on("PageLoad", function(data){
  recordId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
  ZOHO.CRM.API.getRecord({Entity:"Seznik_Automation", RecordID: recordId}).then(function(response){
    var record = response.data[0];
    var rates = record.DTDC_Available_Services || "";
    renderOptions(rates);
  }).catch(function(err){
    document.getElementById("optionsArea").innerHTML =
      "<div class='empty'>Could not read the record: " + JSON.stringify(err) + "</div>";
  });
});

ZOHO.embeddedApp.init();

function renderOptions(rateText){
  var area = document.getElementById("optionsArea");
  parsed = [];
  if(!rateText || rateText.trim() === ""){
    area.innerHTML = "<div class='empty'>No rates on this record yet. Close this window, click <b>Get DTDC Rates</b> first, then try again.</div>";
    return;
  }
  var lines = rateText.split("\n");
  var current = null;
  for(var i = 0; i < lines.length; i++){
    var raw = lines[i];
    var line = raw.trim();
    if(line === "" || line.indexOf("---") === 0){ continue; }
    if(raw.charAt(0) !== " " && line.indexOf("Price:") !== 0 && line.indexOf("ETA:") !== 0){
      if(current){ parsed.push(current); }
      var svcName = line.split("—")[0].trim();
      var modeName = line.indexOf("—") > -1 ? line.split("—")[1].trim() : "";
      current = { service: svcName, mode: modeName, price: "", eta: "" };
    } else if(line.indexOf("Price:") === 0 && current){
      current.price = line.replace("Price:", "").replace("INR", "").trim();
    } else if(line.indexOf("ETA:") === 0 && current){
      current.eta = line.replace("ETA:", "").trim();
    }
  }
  if(current){ parsed.push(current); }

  if(parsed.length === 0){
    area.innerHTML = "<div class='empty'>Rates could not be read. Re-run <b>Get DTDC Rates</b>.</div>";
    return;
  }

  var html = "";
  for(var j = 0; j < parsed.length; j++){
    var p = parsed[j];
    html += "<label class='opt' id='opt" + j + "' onclick='pick(" + j + ")'>";
    html += "<input type='radio' name='svc' value='" + j + "'>";
    html += "<span class='svc'>" + p.service + "</span>";
    html += "<div class='meta'><span class='price'>INR " + p.price + "</span><br>";
    html += p.mode + " &middot; delivery in " + p.eta + "</div>";
    html += "</label>";
  }
  area.innerHTML = html;
}

function pick(idx){
  for(var j = 0; j < parsed.length; j++){
    document.getElementById("opt" + j).className = (j === idx) ? "opt sel" : "opt";
  }
  document.querySelectorAll("input[name=svc]")[idx].checked = true;
  document.getElementById("submitBtn").disabled = false;
}

function submitRate(){
  var statusDiv = document.getElementById("statusMsg");
  var chosen = document.querySelector("input[name=svc]:checked");
  if(!chosen){
    statusDiv.innerHTML = "<span style='color:red;'>Pick a service first.</span>";
    return;
  }
  var p = parsed[parseInt(chosen.value)];
  document.getElementById("submitBtn").disabled = true;
  statusDiv.innerHTML = "Saving...";

  var recordData = {
    "DTDC_Service_Type": p.service,
    "DTDC_Quoted_Price": parseFloat(p.price) || 0,
    "DTDC_Shipping_Status": "Pending - Ready to Ship"
  };

  ZOHO.CRM.API.updateRecord({
    Entity: "Seznik_Automation",
    APIData: Object.assign({id: recordId}, recordData),
    Trigger: ["workflow"]
  }).then(function(response){
    statusDiv.innerHTML = "<span style='color:green;'>Saved " + p.service + ". Now click <b>Book DTDC Shipment &amp; Label</b>.</span>";
    setTimeout(function(){ ZOHO.CRM.UI.Popup.closeReload(); }, 1600);
  }).catch(function(err){
    statusDiv.innerHTML = "<span style='color:red;'>Error: " + JSON.stringify(err) + "</span>";
    document.getElementById("submitBtn").disabled = false;
  });
}
</script>

</body>
</html>
